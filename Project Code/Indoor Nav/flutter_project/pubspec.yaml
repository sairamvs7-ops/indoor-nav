name: indoor_nav
description: A new Flutter project for indoor navigation using ArUco markers and OpenCV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  http: ^1.2.0
  camera: ^0.11.0
  lucide_icons: ^0.257.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  opencv_dart: ^1.0.0
  firebase_core: ^3.10.1
  firebase_database: ^11.3.1
  firebase_auth: ^5.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
