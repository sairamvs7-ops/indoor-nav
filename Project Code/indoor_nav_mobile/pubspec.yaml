name: indoor_nav_mobile
description: >-
  Offline indoor navigation. Scan an ArUco marker to find where you are; the
  route is computed on the phone with bidirectional Dijkstra.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  collection: ^1.19.1
  # Pinned: 1.4.x ships prebuilt OpenCV binaries. 2.x compiles OpenCV from
  # source on every first build and leaves the aruco module out by default.
  opencv_dart: 1.4.5
  provider: ^6.1.5+1
  # Building setup: blueprint photos, storage, sharing and printable markers.
  file_picker: ^10.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  camera_platform_interface: ^2.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
    - assets/floor_plans/
