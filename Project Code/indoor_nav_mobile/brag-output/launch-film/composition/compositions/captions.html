    <div id="cap000" class="clip cap" data-start="0.25" data-duration="3.11" data-track-index="1"><span>Outside, your phone always knows where you are.</span></div>

    <div id="cap003" class="clip cap" data-start="6.91" data-duration="0.98" data-track-index="1"><span>On our own campus,</span></div>
